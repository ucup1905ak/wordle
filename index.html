<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordle</title>
  <script src="src/words.js?v=20261126a" defer></script>
  <script src="src/word-picker.js?v=20261126a" defer></script>
  <script src="src/script.js?v=20261126a" defer></script>
  <link rel="stylesheet" href="styles/style.css?v=20261126a">
</head>
<body>
  <h1>Wordle</h1>

  <div id="grid" aria-label="Wordle grid">
    <div class="row">
      <div id= "a0" class="tile "></div>
      <div id= "a1" class="tile "></div>
      <div id= "a2" class="tile "></div>
      <div id= "a3" class="tile "></div>
      <div id= "a4" class="tile "></div>
    </div>
    <div class="row">
      <div id= "b0" class="tile "></div>
      <div id= "b1" class="tile "></div>
      <div id= "b2" class="tile "></div>
      <div id= "b3" class="tile "></div>
      <div id= "b4" class="tile "></div>
    </div>
    <div class="row">
      <div id= "c0" class="tile "></div>
      <div id= "c1" class="tile "></div>
      <div id= "c2" class="tile "></div>
      <div id= "c3" class="tile "></div>
      <div id= "c4" class="tile "></div>
    </div>
    <div class="row">
      <div id= "d0" class="tile "></div>
      <div id= "d1" class="tile "></div>
      <div id= "d2" class="tile "></div>
      <div id= "d3" class="tile "></div>
      <div id= "d4" class="tile "></div>
    </div>
    <div class="row">
      <div id= "e0" class="tile "></div>
      <div id= "e1" class="tile "></div>
      <div id= "e2" class="tile "></div>
      <div id= "e3" class="tile "></div>
      <div id= "e4" class="tile "></div>
    </div>
    <div class="row">
      <div id= "f0" class="tile "></div>
      <div id= "f1" class="tile "></div>
      <div id= "f2" class="tile "></div>
      <div id= "f3" class="tile "></div>
      <div id= "f4" class="tile "></div>
    </div>
  </div>

  <div id="keyboard">
    <div class="krow">
      <div id="key_q" class="key">q</div>
      <div id="key_w" class="key">w</div>
      <div id="key_e" class="key">e</div>
      <div id="key_r" class="key">r</div>
      <div id="key_t" class="key">t</div>
      <div id="key_y" class="key">y</div>
      <div id="key_u" class="key">u</div>
      <div id="key_i" class="key">i</div>
      <div id="key_o" class="key">o</div>
      <div id="key_p" class="key">p</div>
    </div>
    <div class="krow">
      <div id="key_a" class="key">a</div>
      <div id="key_s" class="key">s</div>
      <div id="key_d" class="key">d</div>
      <div id="key_f" class="key">f</div>
      <div id="key_g" class="key">g</div>
      <div id="key_h" class="key">h</div>
      <div id="key_j" class="key">j</div>
      <div id="key_k" class="key">k</div>
      <div id="key_l" class="key">l</div>
    </div>
    <div class="krow">
      <div id="key_enter" class="key wide">enter</div>
      <div id="key_z" class="key">z</div>
      <div id="key_x" class="key">x</div>
      <div id="key_c" class="key">c</div>
      <div id="key_v" class="key">v</div>
      <div id="key_b" class="key">b</div>
      <div id="key_n" class="key">n</div>
      <div id="key_m" class="key">m</div>
      <div id="key_backspace" class="key wide">&#9003;</div>
    </div>
  </div>

  <div id="winscreen" class="hidden">
    <h2 id="wintitle">You win!</h2>
    <p id="wintime"></p>
    <div id="minigrid"></div>
    <button id="resetbtn">Play again</button>
  </div>
</body>
</html>
